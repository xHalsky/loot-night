<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: silkb; src: url(../../src/assets/fonts/silkscreen-700.woff2) format("woff2"); }
@font-face { font-family: tiny5; src: url(../../src/assets/fonts/tiny5-400.woff2) format("woff2"); }
@font-face { font-family: m5; src: url(../../src/assets/fonts/micro5-400.woff2) format("woff2"); }
@font-face { font-family: jb9; src: url(../../src/assets/fonts/jacquarda-bastarda-9-400.woff2) format("woff2"); }
body { margin: 0; background: #000; } canvas { image-rendering: pixelated; }
</style></head><body><canvas id="c" width="640" height="360"></canvas>
<script type="module">
import { PK } from 'virtual:pagekit';
window.PKT = { PK, ready: false };
PK.init().then(() => { window.PKT.ready = true; });
window.PKT.draw = (scene, tS, t, moment, her) => { const c = PK.drawFrame(scene, tS, t, moment, her, {}); const g = document.getElementById('c').getContext('2d'); g.drawImage(c, 0, 0); return performance.now(); };
</script></body></html>
